name: LoadSurge CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]  # release tags are the only thing that publishes
    # Docs-only commits skip CI. Tag pushes are unaffected: GitHub does not
    # apply path filters to tags, so `git tag vX.Y.Z` still releases.
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its superseded run; main and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The SDK comes from global.json; 8.0.x adds the .NET 8 runtime the net8.0 tests run on.
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore also runs NuGetAudit: known-vulnerable packages surface here as warnings.
    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: |
        dotnet test \
          --solution LoadSurge.sln \
          --configuration Release \
          --no-build \
          --output Detailed \
          --report-trx \
          --coverage \
          --coverage-output-format cobertura \
          --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results
        path: TestResults/

    - name: Upload code coverage
      uses: codecov/codecov-action@v6
      with:
        files: TestResults/*.cobertura.xml
        fail_ci_if_error: false
        verbose: true

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      id-token: write   # OIDC token for NuGet Trusted Publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Extract version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          # Main builds are artifacts only: base version from the csproj + run number
          BASE_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/LoadSurge/LoadSurge.csproj)
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version set to: $VERSION"

    - name: Update .csproj with Version
      run: |
        # Only the version is stamped; PackageReleaseNotes stays canonical from the csproj
        sed -i 's|<Version>.*</Version>|<Version>${{ env.VERSION }}</Version>|' src/LoadSurge/LoadSurge.csproj
        echo "Updated version in .csproj to: ${{ env.VERSION }}"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build release
      run: dotnet build --configuration Release --no-restore

    - name: Create NuGet package
      run: dotnet pack src/LoadSurge --configuration Release --no-build --output ./artifacts

    - name: Upload package artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

    # Trusted Publishing (OIDC) - no long-lived API key. The nuget.org policy is bound to
    # owner=mrviduus, repo=LoadSurge, workflow=ci-cd.yml: renaming this file breaks publishing.
    # The temporary key lives 1 hour, so login must stay adjacent to the push step.
    - name: NuGet login (OIDC -> temporary API key)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: mrviduus

    - name: Publish to NuGet (release tags only)
      # Deliberate releases: `git tag vX.Y.Z` publishes exactly X.Y.Z. Main pushes only
      # upload the .nupkg artifact above, so CI or dependency changes never publish.
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
